<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タブーワード 説明ゲーム</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen p-4">
<div class="max-w-2xl mx-auto">
  <h1 class="text-3xl font-bold text-white text-center mb-2">タブーワード 説明ゲーム</h1>
  <p class="text-gray-400 text-center mb-4 text-sm">禁止語を使わずにお題を説明しよう！</p>

  <!-- Setup Screen -->
  <div id="setup-screen" class="bg-gray-800 rounded-2xl p-6">
    <h2 class="text-xl font-bold text-white mb-4">チーム設定</h2>
    <div class="grid grid-cols-2 gap-4 mb-6">
      <div>
        <label class="text-gray-300 text-sm block mb-1">チームA名</label>
        <input id="team-a-name" type="text" value="チームA" class="w-full bg-gray-700 text-white px-3 py-2 rounded-lg border border-gray-600 focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="text-gray-300 text-sm block mb-1">チームB名</label>
        <input id="team-b-name" type="text" value="チームB" class="w-full bg-gray-700 text-white px-3 py-2 rounded-lg border border-gray-600 focus:outline-none focus:border-blue-500">
      </div>
    </div>
    <h2 class="text-xl font-bold text-white mb-3">カテゴリ選択</h2>
    <div id="category-select" class="grid grid-cols-3 gap-2 mb-6">
    </div>
    <h2 class="text-xl font-bold text-white mb-3">問題数/ラウンド</h2>
    <div class="flex gap-3 mb-6">
      <button class="round-count-btn bg-blue-600 text-white px-4 py-2 rounded-lg" data-count="5" aria-label="5問選択">5問</button>
      <button class="round-count-btn bg-gray-600 text-white px-4 py-2 rounded-lg" data-count="10" aria-label="10問選択">10問</button>
      <button class="round-count-btn bg-gray-600 text-white px-4 py-2 rounded-lg" data-count="15" aria-label="15問選択">15問</button>
    </div>
    <button id="start-btn" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl text-lg font-bold" aria-label="ゲームスタート">ゲームスタート！</button>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="hidden">
    <div class="flex justify-between items-center mb-4">
      <div id="team-indicator" class="text-white font-bold text-xl"></div>
      <div class="flex gap-4">
        <span class="text-gray-300">問題: <span id="q-progress" class="text-white font-bold"></span></span>
        <span class="text-gray-300">スコア A:<span id="score-a" class="text-yellow-400 font-bold">0</span> B:<span id="score-b" class="text-yellow-400 font-bold">0</span></span>
      </div>
    </div>

    <!-- Timer -->
    <div class="bg-gray-800 rounded-2xl p-4 mb-4 flex items-center justify-between">
      <div id="timer-bar-wrap" class="flex-1 bg-gray-700 rounded-full h-4 mr-4">
        <div id="timer-bar" class="h-4 rounded-full bg-green-500 transition-all" style="width:100%"></div>
      </div>
      <div id="timer-display" class="text-3xl font-bold text-white w-12 text-center">30</div>
    </div>

    <!-- Card -->
    <div class="bg-gray-800 rounded-2xl p-6 mb-4">
      <div class="text-center mb-4">
        <span class="text-xs text-gray-400 uppercase tracking-widest" id="card-category"></span>
        <div class="text-4xl font-bold text-white mt-1" id="card-topic"></div>
      </div>
      <div class="border-t border-gray-600 pt-4">
        <p class="text-sm text-red-400 font-semibold mb-2">禁止ワード:</p>
        <div id="taboo-words" class="flex flex-wrap gap-2"></div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <button id="correct-btn" class="bg-green-600 hover:bg-green-700 text-white py-4 rounded-xl text-xl font-bold" aria-label="正解">✓ 正解</button>
      <button id="skip-btn" class="bg-yellow-600 hover:bg-yellow-700 text-white py-4 rounded-xl text-xl font-bold" aria-label="スキップ">→ スキップ</button>
    </div>
  </div>

  <!-- Round End Screen -->
  <div id="round-end-screen" class="hidden bg-gray-800 rounded-2xl p-6 text-center">
    <h2 class="text-2xl font-bold text-white mb-2" id="round-end-title"></h2>
    <div class="text-6xl font-bold text-yellow-400 mb-2" id="round-end-score"></div>
    <p class="text-gray-300 mb-6" id="round-end-msg"></p>
    <button id="next-team-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl text-lg font-bold" aria-label="次のチームへ"></button>
  </div>

  <!-- Final Screen -->
  <div id="final-screen" class="hidden bg-gray-800 rounded-2xl p-8 text-center">
    <h2 class="text-3xl font-bold text-white mb-4">ゲーム終了！</h2>
    <div id="final-scores" class="mb-6"></div>
    <div id="winner-display" class="text-2xl font-bold text-yellow-400 mb-6"></div>
    <button id="restart-final-btn" class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-xl text-lg font-bold" aria-label="もう一度">もう一度プレイ</button>
  </div>
</div>

const CATEGORIES = Object.keys(TABOO_DATA);
let selectedCategories = [...CATEGORIES];
let roundCount = 5;
let teamNames = ['チームA', 'チームB'];
let scores = [0, 0];
let currentTeam = 0;
let currentRound = 0;
let totalRounds = 2;
let roundScore = 0;
let roundSkips = 0;
let questions = [];
let qIndex = 0;
let timerInterval = null;
let timeLeft = 30;

function escapeHtml(str) {
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(str));
  return d.innerHTML;
}

// Setup: category buttons
const catDiv = document.getElementById('category-select');
CATEGORIES.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'bg-blue-600 text-white px-3 py-2 rounded-lg text-sm font-semibold cat-btn';
  btn.setAttribute('aria-label', `${cat}を選択/解除`);
  btn.setAttribute('data-cat', cat);
  btn.textContent = cat;
  btn.addEventListener('click', () => {
    if (selectedCategories.includes(cat)) {
      if (selectedCategories.length === 1) return;
      selectedCategories = selectedCategories.filter(c => c !== cat);
      btn.className = 'bg-gray-600 text-white px-3 py-2 rounded-lg text-sm font-semibold cat-btn';
    } else {
      selectedCategories.push(cat);
      btn.className = 'bg-blue-600 text-white px-3 py-2 rounded-lg text-sm font-semibold cat-btn';
    }
  });
  catDiv.appendChild(btn);
});

document.querySelectorAll('.round-count-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    roundCount = parseInt(btn.dataset.count);
    document.querySelectorAll('.round-count-btn').forEach(b => b.className = 'round-count-btn bg-gray-600 text-white px-4 py-2 rounded-lg');
    btn.className = 'round-count-btn bg-blue-600 text-white px-4 py-2 rounded-lg';
  });
});

document.getElementById('start-btn').addEventListener('click', () => {
  teamNames[0] = document.getElementById('team-a-name').value || 'チームA';
  teamNames[1] = document.getElementById('team-b-name').value || 'チームB';
  scores = [0, 0];
  currentTeam = 0;
  currentRound = 0;
  document.getElementById('setup-screen').classList.add('hidden');
  startTeamTurn();
});

function buildQuestions() {
  const pool = [];
  selectedCategories.forEach(cat => {
    TABOO_DATA[cat].forEach(q => pool.push({...q, category: cat}));
  });
  return shuffle(pool).slice(0, roundCount);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startTeamTurn() {
  questions = buildQuestions();
  qIndex = 0; roundScore = 0; roundSkips = 0;
  document.getElementById('game-screen').classList.remove('hidden');
  document.getElementById('round-end-screen').classList.add('hidden');
  document.getElementById('final-screen').classList.add('hidden');
  document.getElementById('score-a').textContent = scores[0];
  document.getElementById('score-b').textContent = scores[1];
  document.getElementById('team-indicator').textContent = `${teamNames[currentTeam]} のターン`;
  renderCard();
}

function renderCard() {
  if (qIndex >= questions.length) { endRound(); return; }
  const q = questions[qIndex];
  document.getElementById('q-progress').textContent = `${qIndex+1}/${questions.length}`;
  document.getElementById('card-category').textContent = q.category;
  document.getElementById('card-topic').textContent = q.topic;
  const tw = document.getElementById('taboo-words');
  tw.innerHTML = '';
  q.taboo.forEach(w => {
    const span = document.createElement('span');
    span.className = 'bg-red-900 text-red-200 px-3 py-1 rounded-full text-sm font-semibold';
    span.textContent = w;
    tw.appendChild(span);
  });
  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 30;
  updateTimerUI();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      qIndex++;
      renderCard();
    }
  }, 1000);
}

function updateTimerUI() {
  document.getElementById('timer-display').textContent = timeLeft;
  const pct = (timeLeft / 30) * 100;
  const bar = document.getElementById('timer-bar');
  bar.style.width = pct + '%';
  bar.className = 'h-4 rounded-full transition-all ' + (timeLeft > 15 ? 'bg-green-500' : timeLeft > 8 ? 'bg-yellow-500' : 'bg-red-500');
}

document.getElementById('correct-btn').addEventListener('click', () => {
  clearInterval(timerInterval);
  roundScore++;
  scores[currentTeam]++;
  document.getElementById('score-a').textContent = scores[0];
  document.getElementById('score-b').textContent = scores[1];
  qIndex++;
  renderCard();
});

document.getElementById('skip-btn').addEventListener('click', () => {
  clearInterval(timerInterval);
  roundSkips++;
  qIndex++;
  renderCard();
});

function endRound() {
  clearInterval(timerInterval);
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('round-end-screen').classList.remove('hidden');
  document.getElementById('round-end-title').textContent = `${teamNames[currentTeam]} の結果`;
  document.getElementById('round-end-score').textContent = `${roundScore} 正解`;
  document.getElementById('round-end-msg').textContent = `スキップ: ${roundSkips}問 | 通算 A:${scores[0]} B:${scores[1]}`;

  if (currentTeam === 0) {
    const btn = document.getElementById('next-team-btn');
    btn.textContent = `${teamNames[1]} のターンへ`;
    btn.onclick = () => { currentTeam = 1; startTeamTurn(); };
  } else {
    const btn = document.getElementById('next-team-btn');
    btn.textContent = '最終結果を見る';
    btn.onclick = showFinal;
  }
}

function showFinal() {
  document.getElementById('round-end-screen').classList.add('hidden');
  document.getElementById('final-screen').classList.remove('hidden');
  const fs = document.getElementById('final-scores');
  fs.innerHTML = `<div class="flex justify-center gap-12 mb-4">
    <div><div class="text-gray-400 text-sm">${escapeHtml(teamNames[0])}</div><div class="text-5xl font-bold text-blue-400">${scores[0]}</div></div>
    <div class="text-4xl font-bold text-gray-500 flex items-center">:</div>
    <div><div class="text-gray-400 text-sm">${escapeHtml(teamNames[1])}</div><div class="text-5xl font-bold text-red-400">${scores[1]}</div></div>
  </div>`;
  let winner = '';
  if (scores[0] > scores[1]) winner = `🏆 ${escapeHtml(teamNames[0])} の勝利！`;
  else if (scores[1] > scores[0]) winner = `🏆 ${escapeHtml(teamNames[1])} の勝利！`;
  else winner = '引き分け！';
  document.getElementById('winner-display').innerHTML = winner;
}

document.getElementById('restart-final-btn').addEventListener('click', () => {
  scores = [0,0]; currentTeam = 0;
  document.getElementById('final-screen').classList.add('hidden');
